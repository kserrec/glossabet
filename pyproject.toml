[build-system]
requires = ["hatchling>=1.32,<1.33"]
build-backend = "hatchling.build"

[project]
name = "glossabet"
description = "Make a codebase's vocabulary explicit, canonical, inspectable, and maintainable."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kyle Serrecchia" }]
requires-python = ">=3.10"
keywords = ["code-quality", "developer-tools", "glossary", "terminology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/kserrec/glossabet"
Repository = "https://github.com/kserrec/glossabet"
Issues = "https://github.com/kserrec/glossabet/issues"
Changelog = "https://github.com/kserrec/glossabet/blob/main/CHANGELOG.md"

[project.scripts]
glossabet = "glossabet.cli:main"

[dependency-groups]
dev = ["pytest", "PyYAML==6.0.3", "ruff==0.16.4", "mypy==2.3.1"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Objective correctness and import rules only; line length and formatting
# are deliberately not enforced.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
files = ["glossabet"]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
strict_equality = true

[tool.hatch.version]
path = "glossabet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["glossabet"]

[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "glossabet/_skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "/glossabet",
  "/skill",
  "/plugins",
  "/tests",
  "/evaluation",
  "/examples",
  "/docs",
  "/scripts",
  "/.github/workflows",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/DISTRIBUTION.md",
  "/EVALUATION.md",
  "/LICENSE",
  "/NAME-CLEARANCE.md",
  "/PRIVACY.md",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]
